[project]
name = "nagoya-bus-mcp-osc-demo"
version = "0.1.0"
description = "Streamlit chat demo for the nagoya-bus-mcp MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nagoya-bus-mcp>=0.8.0",
    "openai-agents>=0.0.17",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ty>=0.0.38",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "FIX002", "PLC2401", "T201", "TD"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
